# Render Blueprint for the reid-monitor backend.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and creates the service. Everything below is already correct; the
# only value you MUST review is CORS_ORIGIN (see the note on it).
#
# The frontend is deployed separately on Vercel and is not described here.
services:
  - type: web
    name: reid-monitor-api
    runtime: node
    plan: free
    # The backend is self-contained in server/ and never imports the frontend.
    rootDir: server
    # --include=dev is REQUIRED. NODE_ENV=production is set below (the server
    # refuses a wildcard CORS origin without it), and npm honours NODE_ENV by
    # skipping devDependencies. TypeScript is a devDependency, so a plain
    # `npm install` here installs nothing and `npm run build` dies with
    # "tsc: not found". `npm ci` would drop devDeps for the same reason.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Render polls this to decide the service is up. It is a plain synchronous
    # handler that cannot throw, so it answers even while the simulator seeds.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MUST list the exact frontend origin. EventSource is a cross-origin
      # request from the Vercel domain, and the server REJECTS "*" when
      # NODE_ENV=production, so a wrong value here breaks the live stream while
      # leaving the rest of the page working. No trailing slash.
      - key: CORS_ORIGIN
        value: https://reid-monitor.vercel.app
      # Multiplier on the base rate of 120 simulated minutes per real second.
      # The feed is 1-minute resolution, so that is also 120 rows/second: the
      # dataset's 500 hours expand to 29,941 minute rows and a pass takes
      # ~4 min 10 s before it loops.
      - key: SIM_SPEED
        value: "1"
      # 0 = replay the WHOLE dataset live from the first row, skipping nothing.
      # Raise it only if you want the dashboard to open mid-dataset. The unit is
      # MINUTE rows, so an hour of pre-seeded history is 60.
      - key: SEED_ROWS
        value: "0"
      # Replay forever: on reaching the last row the live history is cleared and
      # the run restarts from the beginning. Set to 0 to stop at the end.
      - key: SIM_LOOP
        value: "1"
    # NOTE: no persistent disk on the free plan. data/live/ is rebuilt
    # deterministically from data/source/ on every boot, so history resets on
    # redeploy and when the free instance wakes from sleep. That is acceptable
    # for a demo; add a disk and set DATA_DIR to keep history across restarts.
